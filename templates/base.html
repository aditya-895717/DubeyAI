{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DubeyAI — Enterprise AI chatbot powered by NVIDIA Nemotron">
    <meta name="theme-color" content="{{ site_settings.primary_color }}">
    <link rel="manifest" href="{% url 'manifest_json' %}">
    <link rel="icon" href="{% static 'core/icons/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'core/icons/icon-192.png' %}">
    <title>{% block title %}DubeyAI{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- App styles -->
    <link rel="stylesheet" href="{% static 'chatbot/css/app.css' %}">

    <!-- Dynamic branding from SiteSettings (control panel → Site Settings) -->
    <style>
        :root {
            --bg: {{ site_settings.primary_color }};
            --panel: {{ site_settings.secondary_color }};
            --panel-soft: {{ site_settings.secondary_color }};
            --gold: {{ site_settings.accent_color }};
            --gold-light: {{ site_settings.accent_color }};
            --gold-dark: {{ site_settings.accent_color }};
        }
        body { font-family: {{ site_settings.font_family }}; }
        #pwaInstallButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: var(--gold);
            color: #fff;
            font: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    <button id="pwaInstallButton" type="button" hidden>Install {{ site_settings.site_name|default:"DubeyAI" }}</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'core/js/pwa.js' %}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
